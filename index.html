    <title>日式烤魚</title>
    <!-- the first placeholder's look (#boot, below): src/styles/loading.css and fish-emblem.css, the app's own loading veil's, put in here
         by vite.config.ts (bootLook, item 798) -->
    <!-- boot look -->
    <script>
      // a script that fails to load (an old cached page pointing at files a newer deploy replaced): fetch the
      // page afresh, once
      window.addEventListener('error', function (e) {
        var t = e.target
        if (!t || t.tagName !== 'SCRIPT') return
        try {
          if (sessionStorage.getItem('canteen-boot-retry')) return
          sessionStorage.setItem('canteen-boot-retry', '1')
        } catch (err) { /* storage blocked */ }
        location.replace(location.pathname + '?v=' + Date.now())
      }, true)
      // still nothing after a while: offer a reload
      setTimeout(function () {
        var b = document.getElementById('boot')
        if (b) b.classList.add('is-stuck')
      }, 25000)
    </script>

    <div id="root"><!-- boot --></div>
    <script>
      // (the placeholder's endless motions (the noren, the embers, the fire) counted from the page's start, as the app's veil counts its
      // own (ui/LoadingScreen): put in this one's place, that one takes each up where it was)
      try { document.getElementById('boot').getAnimations({ subtree: true }).forEach(function (a) { a.startTime = 0 }) } catch (e) { /* (older browsers) */ }
    </script>
